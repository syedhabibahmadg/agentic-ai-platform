services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: assistant
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD, pg_isready, -U, assistant, -d, assistant]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: ./backend
    env_file: ${APP_ENV_FILE:-.env}
    environment: &backend_env
      DATABASE_URL: postgresql+asyncpg://assistant:${POSTGRES_PASSWORD}@postgres:5432/assistant
      REDIS_URL: redis://redis:6379/0
    command: [sh, -c, "alembic upgrade head && python -m app.db.checkpoints"]
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    build: ./backend
    env_file: ${APP_ENV_FILE:-.env}
    environment: *backend_env
    volumes: [embedding-cache:/cache]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 15
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres:
  embedding-cache:
